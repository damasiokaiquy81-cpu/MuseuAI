  <style>
    /* O portfólio é a conversão fiel do PDF para site — fundo creme #EEE9E3
       igual ao das páginas, para a transição ser imperceptível. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: #EEE9E3;
      font-family: Georgia, "Times New Roman", serif;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .paginas {
      max-width: 1440px;
      margin: 0 auto;
    }
    .paginas img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* leves divisórias apenas quando a página vizinha escurece as bordas */
    .paginas img + img { margin-top: 2px; }
    @media (max-width: 700px) {
      .paginas img + img { margin-top: 1px; }
    }

    /* WhatsApp flutuante (mesmo estilo redondo do botão da proposta) */
    .zap-flutuante {
      position: fixed; right: 20px; bottom: 20px; z-index: 60;
      width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center;
      background: #FFFDF9; color: #26211A;
      border: 1px solid #D9CFBE;
      box-shadow: 0 14px 34px -12px rgba(60, 50, 35, .45);
      text-decoration: none;
      transition: transform .2s, background .2s, color .2s, border-color .2s;
    }
    .zap-flutuante:hover {
      transform: translateY(-3px);
      background: #26211A; color: #F5F1E8; border-color: #26211A;
    }
    .zap-flutuante:active { transform: scale(.95); }
  </style>
